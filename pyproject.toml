[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-check"
dynamic = ["version"]
description = "Replay semantic event sequences against explicit local adapters"
readme = "PACKAGE.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "PerchAnton" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/PerchAnton/interaction-check"
Documentation = "https://github.com/PerchAnton/interaction-check#readme"
Issues = "https://github.com/PerchAnton/interaction-check/issues"
Changelog = "https://github.com/PerchAnton/interaction-check/blob/main/CHANGELOG.md"

[project.scripts]
interaction-check = "interaction_check:main"

[tool.setuptools]
py-modules = ["interaction_check"]

[tool.setuptools.dynamic]
version = { attr = "interaction_check.VERSION" }
