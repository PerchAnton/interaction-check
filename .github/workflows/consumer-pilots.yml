name: Consumer model pilots
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        example: [cytoscape, rete, surveyjs, tanstack-form, xyflow, diagram-js, grapesjs, fabric, vee-validate, excalidraw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
      - run: node --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/${{ matrix.example }}
      - run: python examples/verify_consumers.py ${{ matrix.example }}
  python-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [pyqtgraph, napari, toga]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/${{ matrix.example }}/requirements.txt
      - name: Install Qt offscreen runtime libraries
        if: matrix.example == 'pyqtgraph'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: python -m pip check
      - run: python examples/verify_python_consumers.py ${{ matrix.example }}
