name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
  photocraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path adapters/photocraft/Cargo.toml --all-targets -- -D warnings
      - run: python3 interaction_check.py scenarios/photocraft/*.json -- adapters/photocraft/target/debug/edit-session-photocraft-probe
  widgets-go:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        adapter: [bubbles, huh, tview, tcell, promptkit, gocui]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Build and check native adapter
        working-directory: adapters/${{ matrix.adapter }}
        run: |
          unformatted="$(gofmt -l *.go)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go test -race ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/probe.exe" .
      - name: Replay native widget scenarios
        run: python interaction_check.py --timeout 30 scenarios/${{ matrix.adapter }}/*.json -- "$RUNNER_TEMP/probe.exe"
  widgets-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter: [cursive, tui-input, tui-textarea, reedline, rustyline, rat-salsa]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path adapters/${{ matrix.adapter }}/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path adapters/${{ matrix.adapter }}/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path adapters/${{ matrix.adapter }}/Cargo.toml --all-targets -- -D warnings
      - run: python3 interaction_check.py scenarios/${{ matrix.adapter }}/*.json -- adapters/${{ matrix.adapter }}/target/debug/interaction-check-${{ matrix.adapter }}
  widgets-python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        adapter: [prompt-toolkit, urwid, asciimatics, textual]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r adapters/${{ matrix.adapter }}/requirements.txt ruff==0.17.2
      - run: python -m ruff check --isolated --select E,F,I --ignore E402 adapters/python_protocol.py adapters/${{ matrix.adapter }}/main.py
      - run: python -m ruff format --isolated --check adapters/python_protocol.py adapters/${{ matrix.adapter }}/main.py
      - run: python interaction_check.py --timeout 30 scenarios/${{ matrix.adapter }}/*.json -- python adapters/${{ matrix.adapter }}/main.py
  javascript:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: adapters/javascript
      - run: npm test
        working-directory: adapters/javascript
      - run: npm run format:check
        working-directory: adapters/javascript
      - run: python adapters/javascript/replay.py
