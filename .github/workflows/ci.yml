name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python examples/quickstart/verify.py
      - run: python tools/render_quickstart.py --check
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_distribution.py dist
  photocraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path adapters/photocraft/Cargo.toml --all-targets -- -D warnings
      - run: python3 interaction_check.py scenarios/photocraft/*.json -- adapters/photocraft/target/debug/edit-session-photocraft-probe
  rust-walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path examples/tui-input/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path examples/tui-input/Cargo.toml --all-targets -- -D warnings
      - run: rustup default 1.99.1
      - run: python3 examples/tui-input/verify.py
