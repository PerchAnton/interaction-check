name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python examples/quickstart/verify.py
      - run: python tools/render_quickstart.py --check
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_distribution.py dist
  photocraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path adapters/photocraft/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path adapters/photocraft/Cargo.toml --all-targets -- -D warnings
      - run: python3 interaction_check.py scenarios/photocraft/*.json -- adapters/photocraft/target/debug/edit-session-photocraft-probe
  rust-walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --check --manifest-path examples/tui-input/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path examples/tui-input/Cargo.toml --all-targets -- -D warnings
      - run: rustup default 1.99.1
      - run: python3 examples/tui-input/verify.py
  interop-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r examples/interop/requirements.txt
      - run: npm --prefix examples/interop ci --ignore-scripts --no-audit --no-fund
      - run: node --test examples/interop/*.test.mjs
      - run: python examples/interop/verify.py --report artifacts/interop/evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interop-example-evidence
          path: artifacts/interop/
          if-no-files-found: error
  patch-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: examples/patch-portability/go.sum
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: python -m pip install -r examples/patch-portability/requirements.txt
      - run: npm --prefix examples/patch-portability ci --ignore-scripts --no-audit --no-fund
      - run: python examples/patch-portability/native_test.py
      - run: node --test examples/patch-portability/native.test.mjs
      - run: node examples/patch-portability/producer.mjs && git diff --exit-code -- examples/patch-portability/scenarios/producer.json
      - run: cargo +1.99.1 test --locked --manifest-path examples/patch-portability/rust/Cargo.toml
      - run: cargo +1.99.1 build --locked --manifest-path examples/patch-portability/rust/Cargo.toml
      - run: go -C examples/patch-portability build -o ../../artifacts/patch-go .
      - name: Fetch exact upstream fixes without changing the published baselines
        run: |
          mkdir -p artifacts/jsondiff-fixed
          curl --fail --location --retry 0 https://api.github.com/repos/bensynapse/jsondiff/tarball/93a94633a7ee0afa1434c29c4e86f1f1b00fb589 -o artifacts/jsondiff-fixed.tgz
          tar -xzf artifacts/jsondiff-fixed.tgz --strip-components=1 -C artifacts/jsondiff-fixed
          python -m pip install --no-deps --target artifacts/jsonpath-fixed https://github.com/jg-rp/python-jsonpath/archive/bd91a15094796927cd683c628169c1a8e8b6ddb6.tar.gz
      - name: Compare the exact immutable-json-patch inverse fix
        run: |
          mkdir -p artifacts/immutable-fixed artifacts/patch-portability
          curl --fail --location --retry 0 https://api.github.com/repos/bardrop-oss/immutable-json-patch/tarball/d3b9ab0aef94ffb10c78fa0713a0e87bab14696d -o artifacts/immutable-fixed.tgz
          tar -xzf artifacts/immutable-fixed.tgz --strip-components=1 -C artifacts/immutable-fixed
          npm --prefix artifacts/immutable-fixed ci --ignore-scripts --no-audit --no-fund
          npm --prefix artifacts/immutable-fixed run build:esm
          node examples/patch-portability/inverse_probe.mjs > artifacts/patch-portability/immutable-before.json
          node examples/patch-portability/inverse_probe.mjs --module artifacts/immutable-fixed/lib/esm/index.js --fixed > artifacts/patch-portability/immutable-after.json
      - run: python examples/patch-portability/check_fixes.py --fixed-jsondiff artifacts/jsondiff-fixed --output artifacts/patch-portability/fixes
      - run: python examples/patch-portability/verify.py --output artifacts/patch-portability/reports --go-adapter artifacts/patch-go --rust-adapter examples/patch-portability/rust/target/debug/patch-portability-adapter --fixed-jsonpath artifacts/jsonpath-fixed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: patch-portability-evidence
          path: artifacts/patch-portability/
          if-no-files-found: error

  lifecycle-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: npm --prefix examples/lifecycle-contracts ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install interaction-check==1.0.0
      - run: node --test examples/lifecycle-contracts/native.test.mjs
      - run: python examples/lifecycle-contracts/verify.py --output artifacts/lifecycle
      - run: python examples/lifecycle-contracts/check_patch_probes.py --output artifacts/patch-probes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lifecycle-contract-evidence
          path: |
            artifacts/lifecycle/
            artifacts/patch-probes/
          if-no-files-found: error
  observer-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: python -m pip install --only-binary=:all: -r examples/observer-boundaries/requirements.txt
      - run: npm --prefix examples/observer-boundaries ci --ignore-scripts --no-audit --no-fund
      - run: node --test examples/observer-boundaries/native.test.mjs
      - run: python examples/observer-boundaries/native_test.py
      - run: python examples/observer-boundaries/verify.py --output artifacts/observer-boundaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observer-boundary-reports
          path: artifacts/observer-boundaries/
          if-no-files-found: error
